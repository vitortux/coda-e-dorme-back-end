spring.application.name=pi-test

# Conecta no banco separado de testes
spring.datasource.url=jdbc:postgresql://localhost:5432/db_backend_testes
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Garante que o schema de testes seja recriado a cada execução
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Evita conflito de porta durante os testes
server.port=0

# Token fake para testes
api.secutity.token.secret=test-secret
